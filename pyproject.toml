[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-origination"
version = "0.1.0"
description = "Vertex Equity proprietary origination engine: thesis-driven discovery, scoring, enrichment, personalization, Lemlist orchestration, reply classification, pipeline analytics and a feedback loop."
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6",
  "jinja2>=3.1",
  "tldextract>=5",
  "rapidfuzz>=3",
  "httpx>=0.27",
  "tenacity>=8",
  "rich>=13",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
mcpkey = ["mcp>=1.0"]

[project.scripts]
vertex = "vertex.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["vertex*"]

[tool.setuptools.package-data]
vertex = ["db/migrations/*.sql", "ai/prompts/*.md", "ai/prompts/*.json", "templates/*.j2"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
