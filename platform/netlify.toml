# Portal deployment (Netlify base directory: platform/)
[build]
  command = "echo 'static portal; functions are bundled by Netlify'"
  publish = "apps/portal/public"
  functions = "apps/portal/netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; frame-src https://*.netlify.app https://*.lasoireebridal.com; connect-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'"
