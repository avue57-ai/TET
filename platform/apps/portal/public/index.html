<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Website Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%237a5c2e%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/portal.css">
</head>
<body>
  <header class="top"><strong id="site-name">Website Assistant</strong><button id="undo" class="link" hidden>Undo last change</button></header>
  <main id="signin" class="center" hidden><p id="signin-msg">Open the link we sent you to sign in.</p></main>
  <main id="app" class="split" hidden>
    <section class="preview" aria-label="Website preview">
      <div class="preview-bar"><span id="preview-label">Your live website</span><a id="preview-open" target="_blank" rel="noopener">Open in new tab</a></div>
      <iframe id="frame" title="Website preview"></iframe>
    </section>
    <section class="chat" aria-label="Assistant">
      <ol id="thread" aria-live="polite"></ol>
      <div id="actions" class="actions" hidden>
        <button id="approve" class="primary">Approve &amp; Publish</button>
        <button id="keep">Keep editing</button>
        <button id="discard" class="link">Discard</button>
      </div>
      <form id="composer">
        <div id="chips" class="chips"></div>
        <label for="text" class="sr">What would you like to change?</label>
        <textarea id="text" rows="3" maxlength="4000" placeholder="What would you like to change on your website?" required></textarea>
        <div class="row">
          <label class="attach">Add photo<input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
          <button id="send" class="primary" type="submit">Generate changes</button>
        </div>
        <p id="error" role="alert" hidden></p>
      </form>
    </section>
  </main>
  <script src="/portal.js" type="module"></script>
</body>
</html>
